name: Build macOS (Intel & Apple Silicon)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
            label: Intel-x86_64
          - os: macos-15
            arch: arm64
            label: AppleSilicon-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install LZO C library via Homebrew
        run: |
          brew install lzo
          LZO_PREFIX="$(brew --prefix lzo)"
          echo "CPATH=${LZO_PREFIX}/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=${LZO_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "CFLAGS=-I${LZO_PREFIX}/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L${LZO_PREFIX}/lib" >> "$GITHUB_ENV"

      - name: Install Python dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build ToyMDict.app with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed \
            --name "ToyMDict" \
            --add-data "variants.json:." \
            --add-data "custom.css:." \
            --add-data "web:web" \
            --collect-submodules "libs" \
            --collect-submodules "core" \
            --collect-submodules "services" \
            --collect-submodules "ui" \
            --collect-submodules "utils" \
            main.py

          # utils/path_helper.py resolves get_app_base_dir() to os.path.dirname(sys.executable)
          # (Contents/MacOS) when sys.frozen is True. Copy runtime assets directly into
          # Contents/MacOS so PyInstaller 6+ finds them alongside the executable.
          MACOS_BIN_DIR="dist/ToyMDict.app/Contents/MacOS"
          cp -f variants.json "$MACOS_BIN_DIR/"
          cp -f custom.css "$MACOS_BIN_DIR/"
          cp -R web "$MACOS_BIN_DIR/"

      - name: Ad-hoc sign app bundle and create DMG / ZIP
        run: |
          codesign --force --deep --sign - "dist/ToyMDict.app"

          ditto -c -k --sequesterRsrc --keepParent \
            "dist/ToyMDict.app" \
            "dist/ToyMDict-macOS-${{ matrix.label }}.zip"

          mkdir -p dist/dmg_staging
          cp -R "dist/ToyMDict.app" dist/dmg_staging/
          ln -s /Applications dist/dmg_staging/Applications
          hdiutil create \
            -volname "ToyMDict" \
            -srcfolder dist/dmg_staging \
            -ov -format UDZO \
            "dist/ToyMDict-macOS-${{ matrix.label }}.dmg"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ToyMDict-macOS-${{ matrix.label }}
          path: |
            dist/ToyMDict-macOS-${{ matrix.label }}.dmg
            dist/ToyMDict-macOS-${{ matrix.label }}.zip
          if-no-files-found: error

      - name: Publish to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ToyMDict-macOS-${{ matrix.label }}.dmg
            dist/ToyMDict-macOS-${{ matrix.label }}.zip
